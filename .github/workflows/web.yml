name: Web interface
on:
  push:
    paths: ['web/**', 'docs/integration/inference_adapter*.json', 'vercel.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'docs/integration/inference_adapter*.json', 'vercel.json', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web test
      - run: python -m unittest discover -s web/tests -p "test_*.py" -v
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run test:browser
      - run: npm --prefix web run build:demo
      - run: npm --prefix web run test:static
