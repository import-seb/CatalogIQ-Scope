[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogiq-scope"
version = "0.1.0"
description = "CatalogIQ product classification capstone project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]

[project.scripts]
catalogiq-clean = "catalogiq.cli:main"
catalogiq-check-structure = "catalogiq.cli:structural_main"
catalogiq-compare-splits = "catalogiq.cli:splitting_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["catalogiq", "catalogiq.*"]
