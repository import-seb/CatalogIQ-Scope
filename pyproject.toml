[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogiq-scope"
version = "0.1.0"
description = "CatalogIQ product classification capstone project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.4,<2",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
splitting = [
    "numpy==2.3.3",
    "pandas==2.3.2",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
]
notebooks = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]

[project.scripts]
catalogiq-clean = "catalogiq.cli:main"
catalogiq-check-structure = "catalogiq.cli:structural_main"
catalogiq-compare-splits = "catalogiq.cli:splitting_main"
catalogiq-segment-baseline = "catalogiq.cli:segment_baseline_main"
catalogiq-split = "catalogiq.cli:split_data_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["catalogiq", "catalogiq.*"]

[tool.setuptools.package-data]
catalogiq = ["resources/segment_final_20261009/*", "resources/segment_final_20261009/tokenizer/*"]
