[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogiq-scope"
version = "0.1.0"
description = "CatalogIQ product classification capstone project"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]